name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main          # dispara en cada push a main
  workflow_dispatch:  # permite lanzarlo manualmente desde GitHub Actions UI

# Permisos necesarios para desplegar en GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Solo un deploy a la vez, sin cancelar el que esté en curso
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Next.js static export
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          # Si tu repo NO es usuario.github.io (es un repo normal),
          # descomenta y ajusta la línea siguiente con el nombre de tu repo:
          # NEXT_PUBLIC_BASE_PATH: /nombre-de-tu-repo
          NODE_ENV: production

      # GitHub Pages ignora carpetas que empiezan por _ (como _next/)
      # Este archivo .nojekyll evita ese comportamiento
      - name: Add .nojekyll file
        run: touch out/.nojekyll

      - name: Upload static export as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
